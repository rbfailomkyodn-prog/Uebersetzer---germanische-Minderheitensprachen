main{max-width:1000px;margin:24px auto;padding:0 16px}
#hero{font-size:46px;font-weight:500;text-align:center;line-height:1.2;margin:8px 0 24px}#hero:empty{display:none}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar select{flex:1;padding:10px;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px}
.sw{background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;color:var(--ac);font-size:18px;cursor:pointer}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.boxes{grid-template-columns:1fr}}
.box{position:relative;min-height:260px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.map{height:220px;margin-bottom:10px;border-radius:10px;background-color:#fff;background-repeat:no-repeat;background-position:center;background-size:contain}

.tag{position:absolute;top:8px;left:12px;font-size:16px;color:var(--mut);z-index:1}
textarea,.out{position:relative;z-index:1;width:100%;min-height:260px;padding:30px 16px 16px;border:0;background:transparent;color:var(--tx);font-size:45px;line-height:1.25;font-family:inherit;resize:none;outline:none;display:block}
.out{white-space:pre-wrap}.out:empty::before{content:attr(data-ph);color:var(--mut)}
.clr{position:absolute;top:4px;right:8px;z-index:4;background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
.ex{margin-top:16px;color:var(--mut);font-size:16px}
.ex button{margin:4px 4px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 12px;color:var(--ac);cursor:pointer;font:inherit}
.foot{margin-top:20px;font-size:14px;color:var(--mut)}
.wb{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-size:20px;cursor:pointer}.wb input{width:22px;height:22px}.wb:has(:disabled){opacity:.45;cursor:not-allowed}
.ov{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.open{display:flex}
.pop{background:var(--card);border-radius:12px;padding:24px;max-width:380px;box-shadow:0 8px 30px #0005}
.pop h2{margin:0 0 8px;font-size:20px}.pop p{color:var(--mut);margin:0 0 16px}
.pop p:empty{display:none}.pop button{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:8px 20px;font:inherit;cursor:pointer}

function wbwRun(raw){const out=$("out"),done=/[\s.,;:!?]$/.test(raw);
const ws=raw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,;:!?]/g,"").split(/\s+/).filter(Boolean);
if(!ws.length){out.textContent="";shown=false;return}
const res=[];let bad=false;
for(let i=0;i<ws.length;){const two=ws[i+1]!==undefined?W[ws[i]+" "+ws[i+1]]:undefined;
 if(two){res.push(two);i+=2;continue}
 const w=W[ws[i]];
 if(w!==undefined)res.push(w);else if(i<ws.length-1||done)bad=true;
 i++}
out.textContent=res.join(" ");
if(bad){const key=ws.join(" ");if(shown!==key){shown=key;$("ov").classList.add("open")}}else shown=false}
function translate(){
const raw=$("inp").value,s=$("sl").value,t=$("tl").value,out=$("out");
if(!raw.trim()){out.textContent="";shown=false;return}
if(s===t){out.textContent=raw;return}
if($("wbw").checked&&s==="lb"&&t==="de"){wbwRun(raw);return}
const done=/[\s.,;:!?]$/.test(raw);let w=norm(raw);
const find=ws=>{for(const row of DATA){const sw=norm(row[IDX[s]]);if(ws.length<=sw.length&&ws.every((x,i)=>sw[i]===x))return {row,sw}}return null};
let m=find(w);
if(!m&&!done){w=w.slice(0,-1);m=w.length?find(w):null}
if(!w.length){out.textContent="";return}
if(m){shown=false;
 const tt=m.row[IDX[t]].split(" ");
 const n=w.length===m.sw.length?tt.length:Math.max(1,Math.round(w.length/m.sw.length*tt.length));
 out.textContent=tt.slice(0,n).join(" ");return}
out.textContent="";
if(!done)return;
const key=w.join(" ");if(shown!==key){shown=key;$("ov").classList.add("open")}}
$("inp").addEventListener("input",translate);$("wbw").addEventListener("change",()=>{if($("wbw").checked){$("sl").value="lb";$("tl").value="de";maps()}translate()});
for(const id of ["sl","tl"])$(id).addEventListener("change",()=>{maps();translate()});
$("sw").onclick=()=>{const a=$("sl").value;$("sl").value=$("tl").value;$("tl").value=a;const o=$("out").textContent;maps();translate()};
$("clr").onclick=()=>{$("inp").value="";translate();$("inp").focus()};
$("ok").onclick=()=>$("ov").classList.remove("open");
$("ddb").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("open")};
document.addEventListener("click",()=>$("menu").classList.remove("open"));
document.querySelectorAll("[data-ui]").forEach(b=>b.onclick=()=>{setUI(b.dataset.ui);maps();translate()});
